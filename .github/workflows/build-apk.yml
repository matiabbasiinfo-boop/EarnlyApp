name: Build Earnly APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Find APK
        run: |
          find . -name "app-debug.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earnly-Debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
